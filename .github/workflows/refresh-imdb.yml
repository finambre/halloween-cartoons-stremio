name: Sort Halloween catalog by IMDb rating

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sort:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download IMDb ratings
        run: |
          curl -L --fail --retry 3 --retry-delay 3 --max-time 180 -o /tmp/ratings.tsv.gz https://datasets.imdbws.com/title.ratings.tsv.gz
          curl -L --fail --retry 3 --retry-delay 3 --max-time 180 -o /tmp/episodes.tsv.gz https://datasets.imdbws.com/title.episode.tsv.gz

      - name: Sort catalogs, refresh posters and enrich episodes
        continue-on-error: true
        run: |
          python - <<'PY'
          import gzip, json, re, time
          from pathlib import Path
          from urllib.request import Request, urlopen

          ratings = {}
          with gzip.open('/tmp/ratings.tsv.gz', 'rt', encoding='utf-8') as f:
              next(f)
              for line in f:
                  p=line.rstrip('\n').split('\t')
                  if len(p)>=2:
                      try: ratings[p[0]]=float(p[1])
                      except ValueError: pass
          episode_map={}
          with gzip.open('/tmp/episodes.tsv.gz','rt',encoding='utf-8') as f:
              next(f)
              for line in f:
                  p=line.rstrip('\n').split('\t')
                  if len(p)>=4: episode_map[(p[1],p[2],p[3])]=p[0]

          catalog_paths=['catalog/series/series_disney.json','catalog/series/series_nickelodeon.json','catalog/series/series_cartoonnetwork.json','catalog/series/series_warner.json','catalog/series/series_classics.json','catalog/movie/movies_az.json']
          def poster(t): return f'https://images.metahub.space/poster/medium/{t}/img'
          def tconst(m):
              mid=str(m.get('id',''))
              if mid.startswith('tt'): return mid
              x=re.search(r'(tt\d+)',str(m.get('poster',''))); return x.group(1) if x else None
          def clean(s):
              s=re.sub(r'^[^A-Za-z0-9]+\s*','',str(s)).strip()
              return re.sub(r'\s*[—-]\s*(Halloween|Spooky)\s*$','',s,flags=re.I).strip()

          for fn in catalog_paths:
              path=Path(fn)
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception as e: print('Skipping invalid catalog',fn,e); continue
              metas=data.get('metas',[])
              for m in metas:
                  tc=tconst(m)
                  if tc: m['poster']=poster(tc)
                  m['name']=clean(m.get('name',''))
              metas.sort(key=lambda m:(-ratings.get(tconst(m),-1),str(m.get('name','')).lower()))
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def cin(sid):
              try:
                  req=Request(f'https://v3-cinemeta.strem.io/meta/series/{sid}.json',headers={'User-Agent':'Halloween-Cartoons-Addon/1.0'})
                  with urlopen(req,timeout=20) as r: return json.load(r).get('meta',{})
              except Exception as e: print('Cinemeta:',sid,e); return {}

          for path in Path('meta/series').glob('*.json'):
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception as e: print('Skipping invalid meta',path,e); continue
              meta=data.get('meta',{}); meta['name']=clean(meta.get('name','')); videos=meta.get('videos',[]); cv={}
              for sid in {str(v.get('id','')).split(':')[0] for v in videos if str(v.get('id','')).startswith('tt')}:
                  for x in cin(sid).get('videos',[]) or []: cv[str(x.get('id',''))]=x
                  time.sleep(.1)
              for v in videos:
                  parts=str(v.get('id','')).split(':'); ep=episode_map.get((parts[0],parts[1],parts[2])) if len(parts)==3 and parts[0].startswith('tt') else None
                  v['_rating']=ratings.get(ep,-1) if ep else -1
                  x=cv.get(str(v.get('id','')), {})
                  for k in ('overview','thumbnail','released','runtime','releaseInfo','genres'):
                      if x.get(k): v[k]=x[k]
              videos.sort(key=lambda v:(-v.get('_rating',-1),str(v.get('title','')).lower()))
              for v in videos: v.pop('_rating',None); v['title']=clean(v.get('title',''))
              meta['videos']=videos; data['meta']=meta; path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest=Path('manifest.json'); m=json.loads(manifest.read_text(encoding='utf-8')); p=str(m.get('version','0.0.0')).split('.'); p[-1]=str(int(p[-1])+1); m['version']='.'.join(p); manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print('New version:',m['version'])
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog meta manifest.json
          git commit -m "Refresh IMDb ordering and posters" || exit 0
          git push
